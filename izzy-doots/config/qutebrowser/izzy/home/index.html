<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>izzychka ~/</title>
    <style>
      :root {
        --surface: #151217;
        --on_surface: #e8e0e8;
        --primary: #ddb9f7;
        --on_surface_variant: #cdc3ce;
        --outline_variant: #4b454d
      }

      * {
        box-sizing: border-box
      }

      body {
        margin: 0;
        background: var(--surface);
        color: var(--on_surface);
        font: 13px 'Maple Mono', 'Maple Mono NF', 'Maple Mono NF CN', monospace;
        min-height: 100vh;
        display: grid;
        place-items: center
      }

      main {
        display: grid;
        grid-template-columns: 280px 1fr;
        align-items: center;
        gap: 55px;
        width: min(800px, 90vw);
        padding: 55px 20px
      }

      svg {
        width: 100%;
        color: var(--on_surface_variant);
        opacity: .6
      }

      h1 {
        font-size: 25px;
        font-weight: 400;
        color: var(--primary);
        margin: 0 0 48px;
        white-space: nowrap
      }

      h1 span {
        animation: blink 1.2s steps(1) infinite
      }

      @keyframes blink {
        50% {
          opacity: 0
        }
      }

      nav {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px
      }

      h2 {
        font-size: 12px;
        font-weight: 400;
        color: var(--primary);
        margin: 0 0 13px
      }

      a {
        display: block;
        text-decoration: none;
        color: var(--on_surface_variant);
        font-size: 11px;
        line-height: 2.05;
        white-space: nowrap
      }

      a:hover,
      a:focus-visible {
        color: var(--primary);
        text-decoration: underline;
        outline: none
      }

      footer {
        margin-top: 36px;
        font-size: 10px;
        color: var(--on_surface_variant);
        opacity: .65
      }

      @media(max-width:720px) {
        main {
          grid-template-columns: 1fr;
          gap: 20px;
          justify-items: center
        }

        svg {
          width: 180px
        }

        h1 {
          font-size: 22px;
          margin-bottom: 30px
        }

        nav {
          gap: 20px
        }
      }

      @media(prefers-reduced-motion:reduce) {
        h1 span {
          animation: none
        }
      }
    </style>
    <link rel="stylesheet" href="palette.css">
  </head>
